<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTM Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100vh; overflow: hidden; }
        body { 
            background: linear-gradient(135deg, #1e3a5f 0%, #2a5298 100%);
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.3);
        }
        
        .header h1 {
            font-size: clamp(24px, 5vw, 48px);
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .header p {
            font-size: clamp(12px, 3vw, 16px);
            color: #b0c4de;
            margin-bottom: 4px;
        }
        
        .menu-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: clamp(10px, 3vw, 20px);
            padding: clamp(15px, 4vw, 30px);
            overflow-y: auto;
        }
        
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(20px, 4vw, 30px);
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            color: #fff;
            font-size: clamp(14px, 3vw, 18px);
            font-weight: 600;
            backdrop-filter: blur(10px);
            min-height: 140px;
        }
        
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .menu-icon {
            font-size: clamp(32px, 8vw, 64px);
            margin-bottom: 10px;
        }
        
        .menu-label {
            text-align: center;
            line-height: 1.3;
        }
        
        @media (max-width: 600px) {
            .menu-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 400px) {
            .menu-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💡 CTM Simulator</h1>
        <p>Science Simulation, MBL, Coding</p>
    </div>
    
    <div class="menu-container">
        <a href="nuri.html" class="menu-item">
            <div class="menu-icon">🚀</div>
            <div class="menu-label">누리호 발사</div>
        </a>
        <a href="cannon.html" class="menu-item">
            <div class="menu-icon">🔫</div>
            <div class="menu-label">포탄 발사</div>
        </a>
        <a href="pendulum.html" class="menu-item">
            <div class="menu-icon">⏱️</div>
            <div class="menu-label">진자 시뮬레이션</div>
        </a>
        <a href="solar.html" class="menu-item">
            <div class="menu-icon">☀️</div>
            <div class="menu-label">태양계</div>
        </a>
    </div>

    <script>
        // 반응형 크기 조정
        function handleResize() {
            const container = document.querySelector('.menu-container');
            if (container) {
                container.style.height = `calc(100vh - ${document.querySelector('.header').offsetHeight}px)`;
            }
        }
        
        window.addEventListener('resize', handleResize);
        window.addEventListener('load', handleResize);
        handleResize();
    </script>
</body>
</html>
