<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>누리호 발사 시뮬레이터 - 우주 100km 버전</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { background: #000; font-family: 'Arial', sans-serif; color: #fff; }
        #canvas { display: block; width: 100%; height: 100%; }
        .panel { position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.95); padding: 20px; border-radius: 12px; width: 360px; z-index: 10; border: 2px solid #0af; font-size: 13px; }
        .panel h1 { font-size: 18px; color: #0af; margin-bottom: 12px; border-bottom: 2px solid #0af; padding-bottom: 8px; }
        .panel p, .panel li { margin: 5px 0; color: #aaa; }
        .panel ul { padding-left: 20px; margin: 8px 0; }
        .control-group { margin: 12px 0; }
        label { display: block; font-size: 12px; color: #0af; margin-bottom: 5px; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; }
        input[type="number"] { width: 80px; padding: 5px; background: #1a1a1a; color: #0af; border: 1px solid #0af; border-radius: 4px; }
        .btn { background: #0af; color: #000; border: none; padding: 12px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 8px; transition: 0.3s; font-size: 14px; }
        .btn:hover { background: #0dd; transform: scale(1.02); }
        .back-btn { background: #555; color: #fff; margin-bottom: 10px; }
        .back-btn:hover { background: #777; }
        #telemetry { position: absolute; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.95); color: #0f0; font-family: 'Courier New', monospace; padding: 16px; border-radius: 8px; width: 340px; z-index: 10; border: 2px solid #0f0; font-size: 11px; }
        .telemetry-header { color: #0f0; font-weight: bold; border-bottom: 1px solid #0f0; padding-bottom: 6px; margin-bottom: 6px; }
        .telemetry-row { display: flex; justify-content: space-between; margin: 4px 0; }
        .telemetry-row span:first-child { color: #0a0; }
        .status { position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.95); color: #0af; padding: 16px; border-radius: 8px; width: 300px; border: 2px solid #0af; font-weight: bold; z-index: 10; }
        .speed-control { position: absolute; top: 20px; right: 340px; background: rgba(0, 0, 0, 0.95); color: #0af; padding: 12px; border-radius: 8px; border: 2px solid #0af; z-index: 10; }
        @keyframes vibrate {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-2px, -1px); }
            20% { transform: translate(2px, 1px); }
            30% { transform: translate(-1px, 2px); }
            40% { transform: translate(1px, -2px); }
            50% { transform: translate(-2px, 1px); }
            60% { transform: translate(2px, -1px); }
            70% { transform: translate(-1px, -2px); }
            80% { transform: translate(1px, 2px); }
            90% { transform: translate(-2px, -1px); }
        }
        #canvas.vibrating {
            animation: vibrate 0.05s infinite;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="panel">
        <button class="btn back-btn" onclick="location.href='index.html'">⬅ 메인으로 돌아가기</button>
        <h1>🚀 누리호 발사 통제소</h1>
        <ul>
            <li><b>SPACE</b>: 발사</li>
            <li><b>C</b>: 카메라 전환</li>
            <li>우주 100km 정확 시뮬</li>
            <li>초기 고 진동 & 빠른 상승</li>
        </ul>
        
        <div class="control-group">
            <label for="time-slider">☀️ 배경 시간</label>
            <input type="range" id="time-slider" min="0" max="1" step="0.1" value="0.7">
        </div>

        <div id="status" style="font-weight: bold; margin: 10px 0; color: #0af;">▶ 발사 대기 중</div>
        <button class="btn" id="launch-btn">🚀 발사 (LAUNCH)</button>
    </div>

    <div class="status" id="status-panel">
        <div id="status-text">📡 시스템 준비 완료</div>
    </div>

    <div class="speed-control">
        <div style="margin-bottom: 8px; font-weight: bold;">⏱️ 시간 배율</div>
        <select id="speed-select" style="width: 100%; padding: 6px; background: #1a1a1a; color: #0af; border: 1px solid #0af; border-radius: 4px; cursor: pointer;">
            <option value="1">1x (실시간)</option>
            <option value="2">2x (2배속)</option>
            <option value="5">5x (5배속)</option>
            <option value="10" selected>10x (10배속)</option>
            <option value="20">20x (20배속)</option>
            <option value="50">50x (50배속)</option>
        </select>
    </div>

    <div id="telemetry">
        <div class="telemetry-header">[ NURI TELEMETRY ]</div>
        <div class="telemetry-row"><span>T-TIME:</span> <span id="t-time">T - 00:00</span></div>
        <div class="telemetry-row"><span>ALTITUDE:</span> <span id="t-alt">0.0 km</span></div>
        <div class="telemetry-row"><span>VELOCITY:</span> <span id="t-vel">0.0 m/s</span></div>
        <div class="telemetry-row"><span>ACCEL:</span> <span id="t-accel">0.0 G</span></div>
        <div class="telemetry-row"><span>PHASE:</span> <span id="t-stage">대기</span></div>
        <div class="telemetry-row"><span>SKY:</span> <span id="t-sky">지표면</span></div>
    </div>

    <script>
        // ==================== 캔버스 & 컨텍스트 ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ==================== 게임 상태 ====================
        let gameState = {
            launching: false,
            time: 0,
            altitude: 0,
            velocity: 0,
            speedMultiplier: 10,
            cameraMode: 0,
            timeOfDay: 0.7,
            stage1Sep: false,
            fairingSep: false,
            stage2Sep: false,
            satSep: false,
            stage3Sep: false,
            vibrationIntensity: 0,
            smokeParticles: [],
            exhaustParticles: []
        };

        // ==================== 파티클 시스템 ====================
        class Particle {
            constructor(x, y, vx, vy, life, type = 'smoke') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.maxLife = life;
                this.type = type;
                this.size = Math.random() * 30 + 20;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
                this.vy -= 20 * dt; // 상승
            }

            draw(ctx) {
                const opacity = Math.max(0, this.life / this.maxLife);
                
                if (this.type === 'smoke') {
                    ctx.fillStyle = `rgba(200, 200, 200, ${opacity * 0.4})`;
                } else if (this.type === 'hot-exhaust') {
                    const heatOp = Math.sin(this.life * 10) * 0.3 + 0.3;
                    ctx.fillStyle = `rgba(255, 150, 0, ${opacity * heatOp})`;
                } else if (this.type === 'flame-smoke') {
                    ctx.fillStyle = `rgba(100, 100, 100, ${opacity * 0.5})`;
                }
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * (1 - this.life / this.maxLife), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==================== 배경 렌더링 ====================
        function drawBackground(altKm, timeOfDay) {
            const altFactor = Math.min(altKm / 100, 1.0); // 0km ~ 100km
            
            // 고도별 색상 변화
            let skyColor;
            if (altFactor < 0.2) {
                // 0-20km: 밝은 하늘
                const t = altFactor / 0.2;
                skyColor = lerpColor(
                    lerpColor('#87CEEB', '#1a1a2e', timeOfDay),
                    '#004B87',
                    t
                );
            } else if (altFactor < 0.5) {
                // 20-50km: 점점 어두워짐
                const t = (altFactor - 0.2) / 0.3;
                skyColor = lerpColor('#004B87', '#001a4d', t);
            } else {
                // 50-100km: 우주 (검은색)
                const t = (altFactor - 0.5) / 0.5;
                skyColor = lerpColor('#001a4d', '#000000', t);
            }
            
            ctx.fillStyle = skyColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 별 그리기 (고도 30km 이상에서만)
            if (altFactor >= 0.3) {
                drawStars(altFactor);
            }

            // 지표 (고도 0-20km)
            if (altFactor < 0.2) {
                const groundY = canvas.height * 0.7;
                ctx.fillStyle = '#0d3b0d';
                ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            }
        }

        function lerpColor(c1, c2, t) {
            const rgb1 = hexToRgb(c1);
            const rgb2 = hexToRgb(c2);
            const r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * t);
            const g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * t);
            const b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * t);
            return `rgb(${r},${g},${b})`;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function drawStars(altFactor) {
            const starOpacity = Math.max(0, (altFactor - 0.3) / 0.7);
            ctx.fillStyle = `rgba(255, 255, 255, ${starOpacity * 0.8})`;
            
            for (let i = 0; i < 200; i++) {
                const seed = i * 12.9898;
                const x = (Math.sin(seed) * 43758.5453 % 1) * canvas.width;
                const y = (Math.sin(seed + 78.233) * 43758.5453 % 1) * canvas.height * 0.6;
                const size = (Math.sin(seed + 45.164) * 2 + 1) * 0.5;
                ctx.fillRect(x, y, size, size);
            }
        }

        // ==================== 상세 발사대 렌더링 ====================
        function drawLaunchPad(rocketX, rocketY) {
            if (gameState.altitude > 3) return; // 고도 3km 이상이면 안 보임
            
            const padY = canvas.height * 0.65;
            const groundY = canvas.height * 0.7;
            
            // ========== 발사대 구조체 ==========
            
            // 1. 발사 플랫폼 (콘크리트)
            ctx.fillStyle = '#555555';
            ctx.fillRect(rocketX - 120, padY, 240, 50);
            
            // 플랫폼 테두리
            ctx.strokeStyle = '#888888';
            ctx.lineWidth = 3;
            ctx.strokeRect(rocketX - 120, padY, 240, 50);
            
            // 2. 강철 지지 기둥 (4개)
            ctx.fillStyle = '#333333';
            const pillarPositions = [-100, -40, 40, 100];
            pillarPositions.forEach(offset => {
                ctx.fillRect(rocketX + offset - 10, padY + 50, 20, 120);
                // 기둥 음영
                ctx.fillStyle = '#222222';
                ctx.fillRect(rocketX + offset + 5, padY + 50, 8, 120);
                ctx.fillStyle = '#333333';
            });
            
            // 3. 배기 덕트 (배기가 나오는 구멍)
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.ellipse(rocketX, padY + 40, 25, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#666666';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 배기 덕트 내부 (검은색 구멍)
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(rocketX, padY + 40, 18, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 4. 발사 타워 (레드 칼라)
            drawLaunchTower(rocketX, padY - 20);
            
            // 5. 엄빌리컬 암 (연료 공급 암)
            if (!gameState.launching) {
                ctx.strokeStyle = '#FF6B35';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(rocketX - 80, padY - 80);
                ctx.quadraticCurveTo(rocketX - 50, padY - 40, rocketX - 15, padY - 5);
                ctx.stroke();
                
                // 암 연결부
                ctx.fillStyle = '#FF6B35';
                ctx.beginPath();
                ctx.arc(rocketX - 80, padY - 80, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(rocketX - 15, padY - 5, 8, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 6. 화염 디플렉터 (배기 유도)
            if (gameState.launching && gameState.time < 2) {
                drawFlameDeflector(rocketX, padY + 50);
            }
            
            // 7. 발사대 지면 (회색 콘크리트)
            ctx.fillStyle = '#666666';
            ctx.fillRect(rocketX - 180, groundY, 360, 50);
            
            // 지면 균열 표현
            ctx.strokeStyle = '#444444';
            ctx.lineWidth = 1;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.moveTo(rocketX - 150 + i * 40, groundY);
                ctx.lineTo(rocketX - 150 + i * 40 + 10, groundY + 20);
                ctx.stroke();
            }
        }

        function drawLaunchTower(x, y) {
            // 타워 본체 (격자 구조)
            ctx.strokeStyle = '#D9381E';
            ctx.lineWidth = 4;
            
            // 왼쪽 기둥
            ctx.beginPath();
            ctx.moveTo(x - 80, y);
            ctx.lineTo(x - 80, y - 200);
            ctx.stroke();
            
            // 오른쪽 기둥
            ctx.beginPath();
            ctx.moveTo(x + 80, y);
            ctx.lineTo(x + 80, y - 200);
            ctx.stroke();
            
            // 대각선 브레이싱 (X자 모양)
            for (let i = 0; i < 4; i++) {
                const startY = y - i * 50;
                ctx.beginPath();
                ctx.moveTo(x - 80, startY);
                ctx.lineTo(x + 80, startY - 50);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(x + 80, startY);
                ctx.lineTo(x - 80, startY - 50);
                ctx.stroke();
            }
            
            // 상단 빔
            ctx.beginPath();
            ctx.moveTo(x - 80, y - 200);
            ctx.lineTo(x + 80, y - 200);
            ctx.stroke();
            
            // 타워 상단 플랫폼
            ctx.fillStyle = '#555555';
            ctx.fillRect(x - 90, y - 210, 180, 15);
        }

        function drawFlameDeflector(x, y) {
            // 배기 유도판 (V자 모양)
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 4;
            ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
            
            // 왼쪽 판
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 50, y + 60);
            ctx.stroke();
            
            // 오른쪽 판
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 50, y + 60);
            ctx.stroke();
            
            // 판 채우기
            ctx.beginPath();
            ctx.moveTo(x - 50, y + 60);
            ctx.lineTo(x, y);
            ctx.lineTo(x + 50, y + 60);
            ctx.fill();
        }

        // ==================== 연기 & 배기 렌더링 ====================
        function generateExhaust(rocketX, rocketY) {
            if (gameState.time < 0.5) return; // 발사 직후 0.5초
            if (gameState.time > 2.5) return; // 2.5초 이후 배기 중단
            
            // 뜨거운 배기 (주황색 화염)
            for (let i = 0; i < 8; i++) {
                const angle = (Math.random() - 0.5) * 0.4;
                const speed = 300 + Math.random() * 200;
                const p = new Particle(
                    rocketX + (Math.random() - 0.5) * 40,
                    rocketY + 80,
                    Math.sin(angle) * speed,
                    -speed * Math.cos(angle),
                    1.5 + Math.random() * 1.5,
                    'hot-exhaust'
                );
                gameState.exhaustParticles.push(p);
            }
            
            // 회색 연기
            for (let i = 0; i < 5; i++) {
                const angle = (Math.random() - 0.5) * 0.6;
                const speed = 200 + Math.random() * 150;
                const p = new Particle(
                    rocketX + (Math.random() - 0.5) * 50,
                    rocketY + 100,
                    Math.sin(angle) * speed,
                    -speed * Math.cos(angle) * 0.8,
                    2 + Math.random() * 2,
                    'flame-smoke'
                );
                gameState.smokeParticles.push(p);
            }
        }

        function drawExhaust() {
            // 배기 파티클 그리기
            gameState.exhaustParticles = gameState.exhaustParticles.filter(p => p.life > 0);
            gameState.exhaustParticles.forEach(p => {
                p.update(0.016);
                p.draw(ctx);
            });
            
            gameState.smokeParticles = gameState.smokeParticles.filter(p => p.life > 0);
            gameState.smokeParticles.forEach(p => {
                p.update(0.016);
                p.draw(ctx);
            });
        }

        // ==================== 로켓 렌더링 ====================
        function drawRocket(screenX, screenY, altitude, speedMultiplier) {
            const scale = Math.max(20 - altitude * 0.15, 8);
            
            // 로켓 본체
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(screenX - scale * 0.3, screenY - scale, scale * 0.6, scale * 2);
            
            // 로켓 상단 뾰족한 부분
            ctx.fillStyle = '#d0d0d0';
            ctx.beginPath();
            ctx.moveTo(screenX - scale * 0.3, screenY - scale);
            ctx.lineTo(screenX + scale * 0.3, screenY - scale);
            ctx.lineTo(screenX, screenY - scale * 1.4);
            ctx.fill();
            
            // 페어링
            if (!gameState.fairingSep) {
                ctx.fillStyle = '#e8e8e8';
                ctx.beginPath();
                ctx.ellipse(screenX - scale * 0.2, screenY - scale * 0.8, scale * 0.45, scale * 0.65, 0, Math.PI, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(screenX + scale * 0.2, screenY - scale * 0.8, scale * 0.45, scale * 0.65, 0, 0, Math.PI);
                ctx.fill();
            }
            
            // 엔진 분사 (강렬한 화염 + 청백색)
            if (gameState.launching && !gameState.satSep) {
                // 파란색 코어 화염
                ctx.fillStyle = `rgba(100, 200, 255, ${0.9 - Math.random() * 0.2})`;
                const flameLength = scale * 4 * (0.9 + Math.random() * 0.5);
                ctx.fillRect(screenX - scale * 0.08, screenY + scale, scale * 0.16, flameLength);
                
                // 주황색 외부 화염
                ctx.fillStyle = `rgba(255, 120, 0, ${0.7 - Math.random() * 0.2})`;
                ctx.fillRect(screenX - scale * 0.15, screenY + scale, scale * 0.3, flameLength * 0.9);
                
                // 가장 밝은 흰색 코어
                ctx.fillStyle = `rgba(255, 255, 200, ${0.8 - Math.random() * 0.3})`;
                ctx.fillRect(screenX - scale * 0.06, screenY + scale, scale * 0.12, flameLength * 0.6);
            }
            
            // 로켓 측면 스트라이프 (한국 국기 색상)
            ctx.fillStyle = '#0052CC';
            ctx.fillRect(screenX - scale * 0.25, screenY - scale * 0.5, scale * 0.1, scale * 0.8);
            ctx.fillStyle = '#D41159';
            ctx.fillRect(screenX + scale * 0.15, screenY - scale * 0.5, scale * 0.1, scale * 0.8);
        }

        // ==================== 발사 로직 ====================
        function startLaunch() {
            if (gameState.launching) return;
            gameState.launching = true;
            gameState.time = 0;
            gameState.stage1Sep = false;
            gameState.fairingSep = false;
            gameState.stage2Sep = false;
            gameState.satSep = false;
            gameState.stage3Sep = false;
            gameState.smokeParticles = [];
            gameState.exhaustParticles = [];
            gameState.vibrationIntensity = 3.0; // 초기 진동 강도
            document.getElementById('status-text').innerText = '🔥 점화! 진동 감지!';
            canvas.classList.add('vibrating');
        }

        function updatePhysics(deltaTime) {
            if (!gameState.launching) return;
            
            const speedMultiplier = parseInt(document.getElementById('speed-select').value);
            gameState.time += deltaTime * speedMultiplier;
            
            const t = gameState.time;
            let altitude = 0, velocity = 0, accel = 0, phase = '대기';
            
            // 물리 시뮬레이션 (초기 빠른 상승)
            if (t < 0.5) {
                // 초기 점화 (0-0.5초) - 진동 최대
                altitude = Math.pow(t, 1.8) * 0.1;
                velocity = t * 200; // 빠른 초기 가속
                accel = 20; // 매우 높은 초기 가속도
                phase = '점화!';
                gameState.vibrationIntensity = 3.0 * (1 - t / 0.5);
            } else if (t < 11) {
                // 1단: 강력한 가속 (0.5-11초)
                altitude = 0.05 + Math.pow(t - 0.5, 2) * 0.45;
                velocity = 200 + (t - 0.5) * 85;
                accel = 8.5;
                phase = '1단 점화';
                gameState.vibrationIntensity = Math.max(0, 1.5 - t * 0.1); // 점차 감소
            } else if (t < 26) {
                // 1단 분리 후 2단 (11-26초)
                altitude = 65 + (t - 11) * 9;
                velocity = 1100 + (t - 11) * 38;
                accel = 3.8;
                phase = '2단 점화';
                gameState.vibrationIntensity = 0;
            } else if (t < 38) {
                // 2단 분리 후 3단 (26-38초)
                altitude = 200 + (t - 26) * 15;
                velocity = 1518 + (t - 26) * 58;
                accel = 5.8;
                phase = '3단 점화';
                gameState.vibrationIntensity = 0;
            } else {
                // 3단 계속 (위성 궤도 투입까지)
                altitude = 380 + (t - 38) * 25;
                velocity = 2122 + (t - 38) * 70;
                accel = 7.0;
                phase = '궤도 투입';
                
                if (t > 45) {
                    gameState.satSep = true;
                    phase = '✅ 궤도 투입 성공';
                    canvas.classList.remove('vibrating');
                }
            }
            
            // 100km 우주 기준선 도달
            if (altitude >= 100) {
                altitude = 100;
                gameState.launching = false;
                phase = '우주 도달!';
                document.getElementById('status-text').innerText = '✅ MISSION SUCCESS! 우주 진입!';
                canvas.classList.remove('vibrating');
            }
            
            // 진동 적용
            if (gameState.vibrationIntensity > 0) {
                if (gameState.vibrationIntensity > 0.1) {
                    canvas.classList.add('vibrating');
                } else {
                    canvas.classList.remove('vibrating');
                }
            }
            
            // 배기 생성
            generateExhaust(canvas.width * 0.5, canvas.height * 0.65);
            
            // 단 분리 로직
            if (t > 11.5 && !gameState.stage1Sep) {
                gameState.stage1Sep = true;
                document.getElementById('t-stage').innerText = '1단 분리';
            }
            
            if (t > 19 && !gameState.fairingSep) {
                gameState.fairingSep = true;
                document.getElementById('t-stage').innerText = '페어링 분리';
            }
            
            if (t > 27 && !gameState.stage2Sep) {
                gameState.stage2Sep = true;
                document.getElementById('t-stage').innerText = '2단 분리';
            }
            
            gameState.altitude = altitude;
            gameState.velocity = velocity;
            
            // UI 업데이트
            document.getElementById('t-time').innerText = `T + ${t.toFixed(1)}s`;
            document.getElementById('t-alt').innerText = `${altitude.toFixed(1)} km`;
            document.getElementById('t-vel').innerText = `${velocity.toFixed(0)} m/s`;
            document.getElementById('t-accel').innerText = `${(accel / 9.8).toFixed(2)} G`;
            document.getElementById('t-stage').innerText = phase;
            
            const skyPhase = altitude < 20 ? '지표면' : altitude < 50 ? '성층권' : altitude < 80 ? '중간권' : '우주';
            document.getElementById('t-sky').innerText = skyPhase;
        }

        // ==================== 메인 애니메이션 루프 ====================
        let lastTime = Date.now();
        
        function animate() {
            const currentTime = Date.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            updatePhysics(deltaTime);
            
            // 배경 그리기
            drawBackground(gameState.altitude, gameState.timeOfDay);
            
            // 발사대 그리기
            const rocketX = canvas.width * 0.5;
            const maxHeight = canvas.height * 0.7;
            const rocketY = maxHeight - (gameState.altitude / 100) * maxHeight;
            
            drawLaunchPad(rocketX, rocketY);
            
            // 배기 및 연기 그리기
            drawExhaust();
            
            // 로켓 그리기
            drawRocket(rocketX, rocketY, gameState.altitude, parseInt(document.getElementById('speed-select').value));
            
            requestAnimationFrame(animate);
        }
        
        // ==================== 이벤트 리스너 ====================
        document.getElementById('launch-btn').addEventListener('click', startLaunch);
        
        document.getElementById('time-slider').addEventListener('input', (e) => {
            gameState.timeOfDay = parseFloat(e.target.value);
            if (!gameState.launching) {
                drawBackground(gameState.altitude, gameState.timeOfDay);
            }
        });
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') startLaunch();
            if (e.key === 'c' || e.key === 'C') gameState.cameraMode = (gameState.cameraMode + 1) % 3;
        });
        
        // ==================== 초기화 ====================
        animate();
    </script>
</body>
</html>
