<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>누리호 (KSLV-II) 3D 정밀 발사 시뮬레이터</title>
    <!-- Three.js 및 OrbitControls CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #050b14;
            --panel-bg: rgba(10, 25, 47, 0.85);
            --panel-border: #172a45;
            --text-primary: #64ffda;
            --text-secondary: #8892b0;
            --text-white: #e6f1ff;
            --accent-red: #ff4d4d;
            --accent-blue: #00bcd4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Courier New', Courier, monospace, 'Malgun Gothic', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-white);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 메인 통제소 HUD 오버레이 */
        #control-center {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: grid;
            grid-template-columns: 320px 1fr 350px;
            grid-template-rows: 80px 1fr 180px;
            padding: 15px;
            gap: 15px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 공통 패널 스타일 */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 10px 30px -15px rgba(2,12,27,0.7);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-primary);
            border-bottom: 1px dashed var(--panel-border);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header::before {
            content: '■ ';
            color: var(--text-primary);
        }

        /* 상단 헤더 패널 */
        header {
            grid-column: 1 / span 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 11, 20, 0.9);
            border-bottom: 2px solid var(--panel-border);
            padding: 0 20px;
        }

        .title-area h1 {
            font-size: 20px;
            letter-spacing: 2px;
            color: var(--text-white);
        }
        .title-area span {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* 왼쪽 패널: 시스템 제어 및 매뉴얼 */
        #system-controls {
            grid-column: 1;
            grid-row: 2;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: #172a45;
            border: 1px solid var(--text-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .btn:hover {
            background: rgba(100, 255, 218, 0.2);
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-launch {
            background: rgba(255, 77, 77, 0.1);
            border-color: var(--accent-red);
            color: var(--accent-red);
            font-size: 16px;
            padding: 15px;
        }

        .btn-launch:hover {
            background: rgba(255, 77, 77, 0.3);
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
        }

        /* 슬라이더 스타일 */
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 4px;
        }

        .slider-container input {
            flex-grow: 1;
            margin-left: 10px;
            accent-color: var(--text-primary);
        }

        /* 오른쪽 패널: 실시간 텔레메트리 데이터 */
        #telemetry-panel {
            grid-column: 3;
            grid-row: 2;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
        }

        .telemetry-item {
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-left: 3px solid var(--panel-border);
        }

        .telemetry-item.active-stage {
            border-left-color: var(--accent-blue);
        }

        .tel-label {
            color: var(--text-secondary);
            font-size: 10px;
            margin-bottom: 3px;
        }

        .tel-val {
            font-size: 16px;
            color: var(--text-white);
            font-weight: bold;
        }

        .tel-unit {
            font-size: 10px;
            color: var(--text-secondary);
            margin-left: 2px;
        }

        /* 하단 패널: 실시간 고도 그래프 및 시퀀스 타임라인 */
        #timeline-panel {
            grid-column: 1 / span 3;
            grid-row: 3;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
        }

        .stage-status-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stage-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 2px;
            font-size: 11px;
        }

        .stage-indicator {
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background: #334155;
            display: inline-block;
        }

        .stage-indicator.ready { background: #eab308; }
        .stage-indicator.burning { background: #ef4444; animation: blink 0.5s infinite alternate; }
        .stage-indicator.separated { background: #3b82f6; }
        .stage-indicator.complete { background: #22c55e; }

        @keyframes blink {
            from { opacity: 0.4; } to { opacity: 1; }
        }

        .graph-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--panel-border);
        }

        canvas#telemetry-graph {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 키 가이드 컴포넌트 */
        .key-badge {
            background: #172a45;
            color: var(--text-primary);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid var(--text-primary);
            font-size: 10px;
            margin-right: 5px;
        }

        /* 가상 콘솔 로그 오버레이 */
        #console-log {
            flex-grow: 1;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 8px;
            font-size: 11px;
            color: #a8b2d1;
            overflow-y: auto;
            max-height: 150px;
            line-height: 1.4;
        }
        .log-entry { margin-bottom: 4px; }
        .log-time { color: var(--text-primary); margin-right: 6px;}
        .log-warn { color: var(--accent-red); }

        /* 모바일 대응 미디어 쿼리 */
        @media (max-width: 900px) {
            #control-center {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto auto;
                overflow-y: auto;
                pointer-events: auto;
            }
            .interactive { pointer-events: auto; }
            #system-controls, #telemetry-panel, #timeline-panel {
                grid-column: 1;
                grid-row: auto;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="control-center">
        <!-- 상단 제어 바 -->
        <header>
            <div class="title-area">
                <h1>KSLV-II NURI CONTROL STATION</h1>
                <span>한국형발새체 누리호 실시간 3D 원격 제어 및 텔레메트리 모니터링 시스템</span>
            </div>
            <div class="interactive" style="display: flex; gap: 15px; font-size: 12px; color: var(--text-primary);">
                <div>SYSTEM STATUS: <span id="top-status-text" style="color: #eab308; font-weight:bold;">발사 대기 중 (READY)</span></div>
            </div>
        </header>

        <!-- 좌측 제어 패널 -->
        <section id="system-controls" class="panel interactive">
            <div class="panel-header">시스템 제어 콘솔 (CONTROLS)</div>
            
            <div class="control-group">
                <button class="btn btn-launch" id="btn-launch-exec">시퀀스 개시 [SPACE]</button>
                <button class="btn" id="btn-cam-toggle">카메라 뷰 전환 [C]</button>
                <button class="btn" id="btn-reset" style="border-color:var(--text-secondary); color:var(--text-secondary);">시뮬레이터 초기화</button>
            </div>
