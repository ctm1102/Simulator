<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>진자 시뮬레이터 (파동진자 / N중진자)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #0b0f19; color: #fff; font-family: sans-serif; }
        
        /* 상단 네비게이션 탭 바 */
        #nav-bar { position: absolute; top: 0; left: 0; width: 100%; height: 50px; background: rgba(10, 12, 20, 0.95); display: flex; align-items: center; justify-content: center; gap: 15px; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-btn { background: #1e293b; color: #cbd5e1; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .nav-btn.active { background: #3b82f6; color: #fff; }

        .sim-view { position: absolute; top: 50px; left: 0; width: 100%; height: calc(100vh - 50px); display: none; }
        .sim-view.active { display: block; }

        .panel { position: absolute; top: 20px; left: 20px; background: rgba(10, 12, 20, 0.92); padding: 20px; border-radius: 12px; width: 300px; z-index: 10; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 16px; margin-bottom: 10px; border-bottom: 2px solid #3b82f6; padding-bottom: 6px; }
        p { font-size: 12px; line-height: 1.5; margin-bottom: 10px; color: #cbd5e1; }
        .btn { background: #3b82f6; color: #fff; border: none; padding: 10px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 6px; transition: 0.2s; }
        .btn:hover { background: #2563eb; }
        .back-link { position: absolute; top: 12px; right: 20px; background: #1e293b; color: #fff; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; z-index: 101; font-size: 12px; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="nav-bar">
        <button class="nav-btn active" onclick="switchPendulumTab(0)">🌊 파동진자 (2D / 3D)</button>
        <button class="nav-btn" onclick="switchPendulumTab(1)">🌀 N중진자 (카오스)</button>
        <a href="index.html" class="back-link">⬅ 메인으로</a>
    </div>

    <!-- [탭 0] 파동진자 시뮬레이터 -->
    <div id="sim-wave" class="sim-view active">
        <div class="panel">
            <h1>🌊 파동진자 (Wave Pendulum)</h1>
            <p>무지개 구슬들이 주기의 차이로 완벽한 파도를 만들어냅니다.</p>
            <button class="btn" id="wave-mode-btn" onclick="toggleWaveMode()">현재 뷰: 3D 모드 (클릭하여 2D 전환)</button>
            <button class="btn" style="background:#334155; margin-top:8px;" onclick="resetWave()">진자 리셋</button>
        </div>
        <div id="wave-container" style="width:100%; height:100%;"></div>
        <canvas id="wave-2d-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; display:none; background:#0b0f19;"></canvas>
    </div>

    <!-- [탭 1] N중진자 시뮬레이터 -->
    <div id="sim-chaos" class="sim-view">
        <div class="panel" style="border-color: rgba(56, 189, 248, 0.4);">
            <h1 style="border-color: #38bdf8;">🌀 N중진자 카오스</h1>
            <p>다중 링크 연결로 예측 불가능하고 아름다운 궤적을 그립니다.</p>
            <button class="btn" style="background:#38bdf8; color:#0f172a;" onclick="resetPendulum()">궤적 초기화</button>
        </div>
        <canvas id="pendulum-canvas" style="width:100%; height:100%; background:#070a12;"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 탭 전환
        function switchPendulumTab(idx) {
            document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.sim-view').forEach((v, i) => v.classList.toggle('active', i === idx));
        }

        // --- 1. 파동진자 로직 ---
        let wScene, wCamera, wRenderer, is3DWave = true;
        let wavePendulums = [], waveTime = 0;
        const numPendulums = 15;
        const colors = [0xff3b30, 0xff9500, 0xffcc00, 0x4cd964, 0x5ac8fa, 0x007aff, 0x5856d6, 0xff2d55, 0xff3b30, 0xff9500, 0xffcc00, 0x4cd964, 0x5ac8fa, 0x007aff, 0x5856d6];

        function initWave() {
            const container = document.getElementById('wave-container');
            wScene = new THREE.Scene();
            wScene.background = new THREE.Color(0x0b0f19);

            wCamera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            wCamera.position.set(0, 0, 70);

            wRenderer = new THREE.WebGLRenderer({ antialias: true });
            wRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(wRenderer.domElement);

            wScene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(20, 30, 40);
            wScene.add(light);

            const baseFreq = 50;
            for(let i=0; i<numPendulums; i++) {
                let freq = baseFreq + i * 2.2;
                let length = 25;
                let group = new THREE.Group();
                let ball = new THREE.Mesh(
                    new THREE.SphereGeometry(1.4, 32, 32),
                    new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.2 })
                );
                group.add(ball);
                wScene.add(group);
                wavePendulums.push({ group, ball, freq, length, zOffset: (i - numPendulums/2) * 2.2 });
            }
            animateWave();
        }

        function toggleWaveMode() {
            is3DWave = !is3DWave;
            let btn = document.getElementById('wave-mode-btn');
            if(is3DWave) {
                btn.innerText = "현재 뷰: 3D 모드 (클릭하여 2D 전환)";
                document.getElementById('wave-container').style.display = 'block';
                document.getElementById('wave-2d-canvas').style.display = 'none';
            } else {
                btn.innerText = "현재 뷰: 2D 모드 (클릭하여 3D 전환)";
                document.getElementById('wave-container').style.display = 'none';
                document.getElementById('wave-2d-canvas').style.display = 'block';
            }
        }

        function resetWave() { waveTime = 0; }

        function animateWave() {
            requestAnimationFrame(animateWave);
            waveTime += 0.03;

            if (is3DWave) {
                wavePendulums.forEach(p => {
                    let angle = Math.sin(waveTime * (50 / p.freq)) * 0.8;
                    let x = Math.sin(angle) * p.length;
                    let y = 25 - Math.cos(angle) * p.length;
                    p.group.position.set(x, y - 10, p.zOffset);
                });
                wRenderer.render(wScene, wCamera);
            } else {
                let canvas = document.getElementById('wave-2d-canvas');
                let ctx = canvas.getContext('2d');
                if (canvas.width !== window.innerWidth || canvas.height !== (window.innerHeight - 50)) {
                    canvas.width = window.innerWidth; canvas.height = window.innerHeight - 50;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let cx = canvas.width / 2;
                let cy = 100;
                let spacing = 35;

                wavePendulums.forEach((p, i) => {
                    let angle = Math.sin(waveTime * (50 / p.freq)) * 0.8;
                    let px = cx + (i - numPendulums/2) * spacing;
                    let py = cy + Math.cos(angle) * 180;

                    ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px, py); ctx.stroke();

                    ctx.fillStyle = '#' + p.ball.material.color.getHexString();
                    ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI*2); ctx.fill();
                });
            }
        }

        // --- 2. N중진자 카오스 로직 ---
        let pCanvas, pCtx;
        let pLengths = [120, 100, 80, 60];
        let pAngles = [Math.PI/2, Math.PI/3, Math.PI/4, Math.PI/6];
        let pVelocities = [0, 0, 0, 0];
        let trail = [];

        function initPendulum() {
            pCanvas = document.getElementById('pendulum-canvas');
            pCtx = pCanvas.getContext('2d');
            resizePendulumCanvas();
            animatePendulum();
        }

        function resizePendulumCanvas() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight - 50;
        }

        function resetPendulum() { trail = []; }

        function animatePendulum() {
            requestAnimationFrame(animatePendulum);
            
            for(let step=0; step<5; step++) {
                let g = 0.2;
                for(let i=0; i<pAngles.length; i++) {
                    pVelocities[i] += -g * Math.sin(pAngles[i]) * 0.04;
                    pAngles[i] += pVelocities[i];
                    pVelocities[i] *= 0.999;
                }
            }

            pCtx.fillStyle = 'rgba(7, 10, 18, 0.2)';
            pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);

            let cx = pCanvas.width / 2;
            let cy = pCanvas.height / 2 - 40;

            let x = cx, y = cy;
            let coords = [{x, y}];

            for(let i=0; i<pAngles.length; i++) {
                let nx = x + pLengths[i] * Math.sin(pAngles[i]);
                let ny = y + pLengths[i] * Math.cos(pAngles[i]);
                coords.push({x: nx, y: ny});
                x = nx; y = ny;
            }

            let tip = coords[coords.length - 1];
            trail.push(tip);
            if(trail.length > 600) trail.shift();

            pCtx.strokeStyle = '#38bdf8'; pCtx.lineWidth = 2;
            pCtx.beginPath();
            for(let i=0; i<trail.length; i++) {
                if(i===0) pCtx.moveTo(trail[i].x, trail[i].y);
                else pCtx.lineTo(trail[i].x, trail[i].y);
            }
            pCtx.stroke();

            pCtx.strokeStyle = '#94a3b8'; pCtx.lineWidth = 3;
            pCtx.beginPath(); pCtx.moveTo(cx, cy);
            coords.forEach(c => pCtx.lineTo(c.x, c.y));
            pCtx.stroke();

            coords.forEach((c, i) => {
                pCtx.fillStyle = i === coords.length - 1 ? '#f43f5e' : '#cbd5e1';
                pCtx.beginPath(); pCtx.arc(c.x, c.y, 6, 0, Math.PI*2); pCtx.fill();
            });
        }

        window.onload = () => {
            initWave();
            initPendulum();
            window.addEventListener('resize', () => {
                wCamera.aspect = window.innerWidth / window.innerHeight;
                wCamera.updateProjectionMatrix();
                wRenderer.setSize(window.innerWidth, window.innerHeight);
                resizePendulumCanvas();
            });
        };
    </script>
</body>
</html>
