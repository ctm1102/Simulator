<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ctm1102 태양계 만들기</title>
    <style>
        body { margin: 0; background: #050508; color: #fff; font-family: sans-serif; overflow: hidden; }
        .panel { position: absolute; top: 20px; left: 20px; background: rgba(20,20,30,0.9); padding: 20px; border-radius: 10px; width: 320px; border: 1px solid #333; z-index: 10; }
        h1 { font-size: 16px; margin-bottom: 10px; border-bottom: 2px solid #f59e0b; padding-bottom: 5px; }
        p { font-size: 12px; margin-bottom: 10px; color: #94a3b8; }
        label { font-size: 12px; display: block; margin-bottom: 5px; color: #94a3b8; }
        input { width: 100%; margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
        .p-btn { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .p-btn.selected { background: #f59e0b; border-color: #f59e0b; color: #000; }
        .btn { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 5px; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>ctm1102 태양계 만들기 제어판</h1>
        <p>행성을 선택한 뒤 우주 공간을 클릭하여 배치하세요.</p>
        <label>공전 속도 조절: <span id="lbl-speed">1.0</span>x</label>
        <input type="range" id="rng-speed" min="0.1" max="3.0" step="0.1" value="1.0">
        <div class="grid">
            <button class="p-btn selected" onclick="setPlanet('수성', 0.8, 0xd1d5db)">수성</button>
            <button class="p-btn" onclick="setPlanet('금성', 1.3, 0xfde047)">금성</button>
            <button class="p-btn" onclick="setPlanet('지구', 1.4, 0x3b82f6)">지구</button>
            <button class="p-btn" onclick="setPlanet('화성', 1.1, 0xef4444)">화성</button>
            <button class="p-btn" onclick="setPlanet('목성', 3.0, 0xf97316)">목성</button>
            <button class="p-btn" onclick="setPlanet('토성', 2.6, 0xfacc15)">토성</button>
        </div>
        <button class="btn" id="btn-clear">모든 행성 초기화</button>
        <button class="btn" style="background:#374151;" onclick="location.href='index.html'">홈으로 돌아가기</button>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, sun, planets = [];
        let selRadius = 0.8, selColor = 0xd1d5db, simSpeed = 1.0;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 2000);
            camera.position.set(0, 80, 120);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            scene.add(new THREE.PointLight(0xffffff, 2.0, 500));

            sun = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 32), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            scene.add(sun);

            document.getElementById('rng-speed').oninput = (e) => { simSpeed = +e.target.value; document.getElementById('lbl-speed').innerText = simSpeed; };

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            container.addEventListener('click', (e) => {
                if (e.clientX > 350 || e.clientY > 360) {
                    const rect = container.getBoundingClientRect();
                    mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
                    mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                    const target = new THREE.Vector3();
                    raycaster.ray.intersectPlane(plane, target);
                    if (target) {
                        const dist = Math.sqrt(target.x**2 + target.z**2);
                        if (dist > 12) {
                            const mesh = new THREE.Mesh(
                                new THREE.SphereGeometry(selRadius, 24, 24),
                                new THREE.MeshStandardMaterial({color: selColor, roughness: 0.5})
                            );
                            mesh.position.set(target.x, 0, target.z);
                            scene.add(mesh);
                            planets.push({ mesh, dist, angle: Math.atan2(target.z, target.x), speed: (0.02 / Math.sqrt(dist / 20)) });
                        }
                    }
                }
            });

            document.getElementById('btn-clear').onclick = () => {
                planets.forEach(p => scene.remove(p.mesh));
                planets = [];
            };

            animate();
        }

        window.setPlanet = function(name, radius, color, dist) {
            selRadius = radius; selColor = color;
            document.querySelectorAll('.p-btn').forEach(b => {
                b.classList.toggle('selected', b.innerText === name);
            });
        };

        function animate() {
            requestAnimationFrame(animate);
            sun.rotation.y += 0.005 * simSpeed;
            planets.forEach(p => {
                p.angle += p.speed * simSpeed;
                p.mesh.position.x = Math.cos(p.angle) * p.dist;
                p.mesh.position.z = Math.sin(p.angle) * p.dist;
            });
            renderer.render(scene, camera);
        }
        window.onload = init;
    </script>
</body>
</html>
